# Runs ent.test.sh on the three platforms ent claims to support.
#
# The macOS job is the point of this file. Apple still ships bash 3.2.57 (2007)
# as /bin/bash, because every later bash is GPLv3, and that is the oldest bash
# ent supports. macOS also brings the BSD versions of sed, find and mktemp,
# which differ from the GNU ones, so this job is where "works on a Mac" is
# actually settled rather than assumed.
#
# The suite skips the tests that do not apply to the platform it is running on
# and prints them as SKIP, so each job covers its own half of the pairs.

name: test

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS (bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Called by full path, so a newer bash on PATH cannot stand in for it.
      - name: bash version
        run: /bin/bash --version
      - name: ent.test.sh
        run: /bin/bash ent.test.sh

  linux:
    name: Linux (bash 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash version
        run: bash --version
      - name: ent.test.sh
        run: bash ent.test.sh

  windows:
    name: Windows (Git Bash)
    runs-on: windows-latest
    # `shell: bash` on a Windows runner is the bash that ships with Git for
    # Windows, which is what ent is actually used under there.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: bash version
        run: bash --version
      - name: ent.test.sh
        run: bash ent.test.sh
